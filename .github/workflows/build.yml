name: Build VPP plugin

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  VPP_REPO: https://github.com/FDio/vpp.git
  VPP_REF: stable/2606

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Clone VPP ${{ env.VPP_REF }}
        run: |
          git clone --depth 1 --branch "$VPP_REF" "$VPP_REPO" vpp

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: vpp-${{ env.VPP_REF }}

      # ext-deps (DPDK etc.) deliberately skipped: l2flow only needs vlib/vnet
      - name: Install VPP build dependencies
        run: |
          cd vpp
          sudo -E apt-get update
          make UNATTENDED=yes install-dep

      - name: Inject plugin into VPP source tree
        run: |
          cp -r src/l2flow vpp/src/plugins/l2flow

      # build only the plugin target and its library deps, not all of VPP
      - name: Build l2flow plugin
        run: |
          cmake -S vpp/src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build --target l2flow_plugin

      - name: Check plugin binary
        run: |
          PLUGIN=$(find build -name 'l2flow_plugin.so' -print -quit)
          test -n "$PLUGIN" || { echo "l2flow_plugin.so not built"; exit 1; }
          echo "Built: $PLUGIN"
          mkdir -p artifacts
          cp "$PLUGIN" artifacts/

      - name: Upload plugin binary
        uses: actions/upload-artifact@v4
        with:
          name: l2flow_plugin
          path: artifacts/l2flow_plugin.so
          if-no-files-found: error

      - name: Build deb package
        run: |
          VPP_TAG="vpp$(echo "$VPP_REF" | tr -dc '0-9')"
          VERSION="1.0.${{ github.run_number }}"
          PKGDIR=pkg/l2flow-plugin
          mkdir -p "$PKGDIR/usr/lib/x86_64-linux-gnu/vpp_plugins" "$PKGDIR/DEBIAN"
          install -m 644 artifacts/l2flow_plugin.so "$PKGDIR/usr/lib/x86_64-linux-gnu/vpp_plugins/"
          cat > "$PKGDIR/DEBIAN/control" <<EOF
          Package: l2flow-plugin
          Version: $VERSION
          Architecture: amd64
          Maintainer: vpp-l2-flow-tracking
          Section: net
          Priority: optional
          Description: VPP l2flow plugin (SFDP flow tracking for L2 xconnect)
           Built against VPP $VPP_REF (commit $(git -C vpp rev-parse --short HEAD)).
          EOF
          dpkg-deb --build --root-owner-group "$PKGDIR" "artifacts/l2flow-plugin_amd64-${VPP_TAG}.deb"
          dpkg --contents "artifacts/l2flow-plugin_amd64-${VPP_TAG}.deb"
          dpkg --info "artifacts/l2flow-plugin_amd64-${VPP_TAG}.deb"

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: l2flow-plugin-deb
          path: artifacts/*.deb
          if-no-files-found: error
