name: Build VPP plugin

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  VPP_REPO: https://github.com/FDio/vpp.git
  VPP_REF: stable/2606

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Clone VPP ${{ env.VPP_REF }}
        run: |
          git clone --depth 1 --branch "$VPP_REF" "$VPP_REPO" vpp

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: vpp-${{ env.VPP_REF }}

      # ext-deps (DPDK etc.) deliberately skipped: l2flow only needs vlib/vnet
      - name: Install VPP build dependencies
        run: |
          cd vpp
          sudo -E apt-get update
          make UNATTENDED=yes install-dep

      - name: Inject plugin into VPP source tree
        run: |
          cp -r src/l2flow vpp/src/plugins/l2flow

      # build only the plugin target and its library deps, not all of VPP
      - name: Build l2flow plugin
        run: |
          cmake -S vpp/src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build --target l2flow_plugin

      - name: Check plugin binary
        run: |
          PLUGIN=$(find build -name 'l2flow_plugin.so' -print -quit)
          test -n "$PLUGIN" || { echo "l2flow_plugin.so not built"; exit 1; }
          echo "Built: $PLUGIN"
          mkdir -p artifacts
          cp "$PLUGIN" artifacts/

      - name: Upload plugin binary
        uses: actions/upload-artifact@v4
        with:
          name: l2flow_plugin
          path: artifacts/l2flow_plugin.so
          if-no-files-found: error
